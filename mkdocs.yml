# English site, built by build_docs.py from the tree it prepares in
# .docs_build/en. mkdocs.fr.yml builds the French site; the two differ only in
# site_url, docs_dir, site_dir, theme.language, and the text shown to readers:
# description, palette toggle names, navigation titles.

site_name: VOLUTE
site_description: Interactive and batch video segmentation and point tracking with SAM 2
site_url: https://nicolasaudibert.github.io/VOLUTE/
repo_url: https://github.com/nicolasaudibert/VOLUTE
repo_name: nicolasaudibert/VOLUTE

docs_dir: .docs_build/en
site_dir: site

theme:
  name: material
  variant: modern
  language: en
  custom_dir: overrides
  logo: lockup_horizontal.svg
  favicon: favicon.png
  features:
    - content.code.copy
    - navigation.footer
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  # Logo shown in dark mode, by overrides/partials/logo.html.
  logo_dark: lockup_horizontal_dark.svg
  # overrides/partials/alternate.html appends the current page's address, so
  # the selector leads to the same page in the other language.
  alternate:
    - name: English
      link: /VOLUTE/
      lang: en
    - name: Français
      link: /VOLUTE/fr/
      lang: fr

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
      # GitHub's anchors: lower case, accented letters kept, each space a hyphen.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search
  - exclude:
      glob:
        - banner.png

nav:
  - Home: index.md
  - Installation:
      - Windows: install-windows.md
      - macOS: install-macos.md
      - Linux (Ubuntu): install-linux.md
      - Manual installation: https://github.com/nicolasaudibert/VOLUTE/blob/main/INSTALL.md
  - Tutorial:
      - Overview: tutorial/index.md
      - 1. Before you start: tutorial/start.md
      - 2. Loading the frames: tutorial/load-frames.md
      - 3. A first object: tutorial/first-object.md
      - 4. Several objects: tutorial/objects.md
      - 5. Correcting masks: tutorial/corrections.md
      - 6. Following the objects through the video: tutorial/tracking.md
      - 7. Display and reference points: tutorial/display.md
      - 8. Exporting the results: tutorial/export.md
      - 9. Saving, resuming, batch processing: tutorial/project.md
      - 10. Following points with SAM2++: tutorial/points.md
      - 11. Settings, language, shortcuts: tutorial/settings.md
  - FAQ: faq.md
  - Reference documentation: https://github.com/nicolasaudibert/VOLUTE/blob/main/DOCUMENTATION.md
